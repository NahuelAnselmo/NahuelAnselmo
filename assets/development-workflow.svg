      <text x="27" y="40" fill="#172411" font-size="16" font-weight="700">03</text>
      <text x="64" y="39" fill="#EEF3E9" font-size="18" font-weight="700">Verifico</text>
      <text x="24" y="78" fill="#9FB0A2" font-size="14">Lint, tipos, pruebas y revisión</text>
