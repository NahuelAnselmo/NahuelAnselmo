      <text x="27" y="40" fill="#172411" font-size="16" font-weight="700">01</text>
      <text x="64" y="39" fill="#EEF3E9" font-size="18" font-weight="700">Planifico</text>
      <text x="24" y="78" fill="#9FB0A2" font-size="14">Problema, alcance y decisiones</text>
      <text x="24" y="100" fill="#9FB0A2" font-size="14">antes de sumar complejidad.</text>
    </g>

    <g transform="translate(340 124)">
      <rect width="245" height="118" rx="14" fill="#15221A" stroke="#405447"/>
      <circle cx="35" cy="34" r="17" fill="#BADE92"/>
      <text x="27" y="40" fill="#172411" font-size="16" font-weight="700">02</text>
      <text x="64" y="39" fill="#EEF3E9" font-size="18" font-weight="700">Construyo</text>
      <text x="24" y="78" fill="#9FB0A2" font-size="14">TypeScript, componentes claros</text>
      <text x="24" y="100" fill="#9FB0A2" font-size="14">y reglas cerca del dominio.</text>
    </g>

    <g transform="translate(610 124)">
