  <rect width="1200" height="300" rx="24" fill="url(#workflow-bg)"/>
  <path d="M70 102H1130" stroke="#405447" stroke-width="2" stroke-dasharray="5 8"/>

  <g font-family="Arial, Helvetica, sans-serif">
